<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    >
    <title>JReferee Board Viewer</title>
    <link rel="stylesheet" href="/ui/viewer.css">
    <script defer src="/ui/viewer.js"></script>
</head>

<body>
<header class="toolbar">
    <h1>JReferee Board Viewer</h1>

    <nav class="replay-controls" aria-label="Board history navigation">
        <button
                id="first-turn"
                type="button"
                title="First recorded position"
                aria-label="First recorded position"
        >
            |&lt;
        </button>

        <button
                id="previous-turn"
                type="button"
                title="Previous recorded position"
                aria-label="Previous recorded position"
        >
            &lt;
        </button>

        <output id="turn-label" aria-live="polite">
            Loading board history…
        </output>

        <button
                id="next-turn"
                type="button"
                title="Next recorded position"
                aria-label="Next recorded position"
        >
            &gt;
        </button>

        <button
                id="last-turn"
                type="button"
                title="Latest recorded position"
                aria-label="Latest recorded position"
        >
            &gt;|
        </button>
    </nav>

    <button id="reset-selection" type="button">
        Reset selection
    </button>
</header>

<main class="viewer-layout">
    <section class="map-panel" aria-label="Diplomacy board">
        <div id="map-host" class="map-host"></div>
        <div id="tooltip" class="tooltip" hidden></div>
    </section>

    <aside class="details-panel" aria-live="polite">
        <h2>Selected province</h2>

        <p id="selection-empty">
            Click a province or unit on the board.
        </p>

        <dl id="province-details" hidden>
            <dt>Province</dt>
            <dd id="detail-province"></dd>

            <dt>Supply-center owner</dt>
            <dd id="detail-owner"></dd>

            <dt>Unit</dt>
            <dd id="detail-unit"></dd>
        </dl>

        <section class="keyboard-help" aria-label="Keyboard controls">
            <h3>History controls</h3>
            <p>
                <kbd>←</kbd> Previous
                <kbd>→</kbd> Next
                <kbd>Home</kbd> First
                <kbd>End</kbd> Latest
            </p>
        </section>
    </aside>
</main>
</body>
</html>
